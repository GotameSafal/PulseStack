services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsestack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsestack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsestack_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pulsestack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulsestack} -d ${POSTGRES_DB:-pulsestack}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulsestack-network

  redis:
    image: redis:7-alpine
    container_name: pulsestack-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secret}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - pulsestack-network

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: pulsestack-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-pulsestack}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse_secret}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./docker/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pulsestack-network

volumes:
  postgres_data:
    name: pulsestack_postgres_data
  redis_data:
    name: pulsestack_redis_data
  clickhouse_data:
    name: pulsestack_clickhouse_data

networks:
  pulsestack-network:
    name: pulsestack-network
    driver: bridge
